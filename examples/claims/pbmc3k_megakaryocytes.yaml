# Data: data/pbmc3k_raw.h5ad (written by: uv run python -c "import scanpy as sc; sc.settings.datasetdir='data'; sc.datasets.pbmc3k()")
# Run with: uv run recluster run --data data/pbmc3k_raw.h5ad --claim examples/claims/pbmc3k_megakaryocytes.yaml
# Megakaryocytes / platelets: a very small population (~15 cells) in PBMC3k.
claim_type: population_exists
name: "Megakaryocytes exist as a distinct population (PBMC3k)"
target:
  markers: [PPBP, PF4]
  min_cells: 10
