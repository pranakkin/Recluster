# Audit mode: data/synthetic_processed.h5ad (scripts/make_processed_example.py) carries another
# tool's labels in .obs['tool_label'] and raw counts in layers['counts'].
# Run with: recluster audit --data data/synthetic_processed.h5ad --claim this.yaml
claim_type: composition_shift
name: "Mono (as labelled by the tool) more abundant in stim (synthetic, audit)"
columns:
  condition: condition
  sample: [donor, condition]
  batch: donor
  labels: tool_label
target:
  label_value: Mono
comparison:
  group_a: stim
  group_b: ctrl
  direction: higher_in_a
