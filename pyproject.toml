[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "recluster"
version = "0.6.0"
description = "An independent stress test for single-cell RNA-seq claims."
readme = "README.md"
license = { text = "Proprietary. Copyright (c) 2026 Pranavi Akkinepally. All rights reserved." }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Pranavi Akkinepally" }]
dependencies = [
  "scanpy==1.11.5",
  "anndata==0.12.19",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "pandas==2.3.3",
  "scikit-learn==1.9.1",
  "igraph==1.0.0",
  "harmonypy==2.1.0",
  "pydeseq2==0.5.4",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "typer==0.29.0",
  "jinja2==3.1.6",
  "h5py==3.16.0",
  "scikit-image==0.26.0",
]

[project.optional-dependencies]
llm = ["anthropic==2.8.0"]

[project.scripts]
recluster = "recluster.cli:app"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "types-PyYAML",
  "openpyxl>=3.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["recluster"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
